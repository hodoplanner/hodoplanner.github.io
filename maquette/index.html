<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HodoPlanner · maquette de l’app</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#3b3a5e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="../images/brand/lapin-icone.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../images/brand/lapin-app-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HodoPlanner" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/planner.css" />
  <link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css" />
  <style>
    /* ---------- Cadre : plein écran sur mobile, téléphone sur ordinateur ---------- */
    html, body{height:100%}
    body{background:var(--paper); overflow:hidden}
    .stage{height:100%; display:grid; place-items:center}
    .demo-tag{position:fixed; z-index:1000; top:calc(env(safe-area-inset-top,0px) + 6px); left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; color:#8a6a1f; background:var(--yellow-soft); border:1.5px dashed var(--yellow); border-radius:99px; padding:2px 10px; white-space:nowrap}
    .demo-tag button{border:0; background:none; font-weight:800; text-decoration:underline; padding:0 0 0 6px; font-size:11px; color:inherit}
    .phone{position:relative; width:100%; height:100%; display:flex; flex-direction:column; background:var(--paper); overflow:hidden}
    @media (min-width:700px){
      body{background:linear-gradient(180deg, var(--blue-soft), var(--paper))}
      .phone{width:390px; height:min(820px, calc(100vh - 70px)); border:var(--line); border-radius:40px; box-shadow:8px 8px 0 var(--lav)}
    }
    .screen{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:16px 16px 28px}
    .screen.center{display:grid; align-content:center; gap:14px; text-align:center; justify-items:center}
    .screen.flush{padding:0; overflow:hidden; position:relative}
    .stack, form{display:grid; grid-template-columns:minmax(0,1fr); gap:12px}
    .two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}

    /* ---------- En-tête ---------- */
    .app-top{display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 30px) 14px 10px; border-bottom:2px solid var(--ink); background:#fff}
    @media (min-width:700px){ .app-top{padding-top:14px} }
    .app-top b{font-size:16px; line-height:1.2; display:block}
    .app-top small{display:block; font-size:11.5px; color:var(--ink-2); font-weight:600}
    .app-top .sp{flex:1}
    .icon-btn{width:38px; height:38px; flex:0 0 38px; border-radius:12px; border:2px solid var(--ink); background:#fff; font-weight:800; display:grid; place-items:center; padding:0}
    .erika-top{background:var(--ink); color:#fff}
    .erika-top small{color:#d9d6ec}
    .erika-top .icon-btn, .erika-top .btn{color:var(--ink)}

    /* ---------- Barre d'onglets avec icônes dessinées ---------- */
    .tabs{display:grid; grid-template-columns:repeat(5,1fr); border-top:2px solid var(--ink); background:#fff; padding-bottom:var(--safe-b)}
    .tabs button{border:0; background:none; padding:6px 0 7px; display:grid; justify-items:center; gap:1px; font-size:10.5px; font-weight:700; color:var(--ink-3)}
    .tabs svg{width:30px; height:30px; transition:transform .15s}
    .tabs button:not(.on) svg{filter:grayscale(1); opacity:.5}
    .tabs button.on{color:var(--ink)}
    .tabs button.on svg{transform:translateY(-2px) scale(1.08)}

    /* ---------- Blocs ---------- */
    h1.big{font-size:30px; letter-spacing:-.8px}
    .sub{color:var(--ink-2); font-size:14px}
    .btn.block{width:100%}
    .card{padding:14px}
    .sec-t{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:22px 0 10px}
    .sec-t h2{font-size:18px; display:flex; gap:6px; align-items:baseline}
    .sec-t h2 .jp{font-size:12px}
    .sec-t button{font-size:12.5px; font-weight:700; border:0; background:none; text-decoration:underline; text-underline-offset:3px; padding:0}
    .hello{background:linear-gradient(180deg, var(--blue-soft), #fff); --sh:var(--blue)}
    .hello h2{font-size:22px}
    .count{display:flex; gap:8px; margin-top:10px}
    .count div{flex:1; background:#fff; border:2px solid var(--ink); border-radius:14px; padding:7px 4px; text-align:center}
    .count b{display:block; font-size:21px; line-height:1.1}
    .count small{font-size:10.5px; color:var(--ink-2); font-weight:600}
    .bar{height:12px; border:2px solid var(--ink); border-radius:99px; background:#fff; overflow:hidden}
    .bar i{display:block; height:100%; background:var(--mint); border-right:2px solid var(--ink)}

    .item{display:flex; gap:11px; align-items:center; padding:10px 12px; width:100%; text-align:left; background:#fff; border:2px solid var(--ink); border-radius:16px; box-shadow:3px 3px 0 var(--sh, var(--pink))}
    .item + .item{margin-top:10px}
    .item .ic{flex:0 0 40px; width:40px; height:40px; display:grid; place-items:center; background:var(--tint); border-radius:12px}
    .item .tx{flex:1; min-width:0}
    .item .tx b{display:block; font-size:14px; line-height:1.25}
    .item .tx small{display:block; font-size:11.5px; color:var(--ink-2); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .item .pill{font-size:10.5px; padding:2px 8px}
    .item.done{--sh:var(--mint); background:#fbfffd}
    .item.done .tx b{color:var(--ink-2)}
    .tick{flex:0 0 26px; width:26px; height:26px; border:2px solid var(--ink); border-radius:8px; display:grid; place-items:center; font-weight:800; font-size:14px; background:#fff}
    .item.done .tick{background:var(--mint)}
    .filters{display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .filters button{flex:0 0 auto; border:2px solid var(--ink); background:#fff; border-radius:12px; padding:5px 12px; font-weight:700; font-size:12.5px}
    .filters button.on{background:var(--ink); color:#fff}

    /* jours */
    .day{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:#fff; border:2px solid var(--ink); border-radius:16px; padding:10px 12px; box-shadow:3px 3px 0 var(--sh, var(--mint))}
    .day + .day{margin-top:10px}
    .day .d{flex:0 0 50px; text-align:center; border:2px solid var(--ink); border-radius:12px; background:var(--c, #fff); padding:3px 0}
    .day .d b{display:block; font-size:18px; line-height:1.1}
    .day .d small{font-size:10px; font-weight:700; color:var(--ink-2); text-transform:uppercase}
    .day .tx{flex:1; min-width:0}
    .day .tx b{font-size:14.5px; display:block}
    .day .tx p{font-size:12px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .day .chev{font-weight:800; color:var(--ink-3)}

    .dhero{display:flex; gap:12px; align-items:center; --sh:var(--mint)}
    .dhero .d{flex:0 0 62px; text-align:center; border:2px solid var(--ink); border-radius:14px; background:var(--c); padding:5px 0}
    .dhero .d b{display:block; font-size:24px; line-height:1}
    .dhero .d small{font-size:10.5px; font-weight:700; text-transform:uppercase; color:var(--ink-2)}
    .dhero h2{font-size:21px}
    .minimap{height:190px; border:var(--line); border-radius:18px; overflow:hidden; margin-top:14px; box-shadow:3px 3px 0 var(--blue)}
    .tl{position:relative; margin-top:6px}
    .stop{position:relative; display:grid; grid-template-columns:44px 1fr; gap:10px; padding-bottom:16px}
    .stop::before{content:""; position:absolute; left:21px; top:44px; bottom:0; border-left:2.5px dotted var(--ink-3)}
    .stop:last-child::before{display:none}
    .stop .ic{width:44px; height:44px; display:grid; place-items:center; background:#fff; border:2px solid var(--ink); border-radius:14px}
    .stop .when{font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--red)}
    .stop b{display:block; font-size:15px}
    .stop p{font-size:13px; color:var(--ink-2)}
    .stop .tip{margin-top:6px; font-size:12.5px; background:var(--yellow-soft); border:1.5px dashed #e9b84d; border-radius:12px; padding:6px 9px}
    .stop a{font-size:12px; font-weight:700}
    .eat{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
    .eat div{background:#fff; border:2px solid var(--ink); border-radius:14px; padding:10px; box-shadow:2px 2px 0 var(--pink)}
    .eat b{display:block; font-size:13.5px; margin-top:4px}
    .eat p{font-size:11.5px; color:var(--ink-2)}
    .nav2{display:flex; justify-content:space-between; gap:10px; margin-top:20px}

    /* carte */
    #tripMap{position:absolute; inset:0}
    .leaflet-container{background:#cfe6f7; font-family:var(--font)}
    .map-legend{position:absolute; z-index:500; top:10px; right:10px; background:#fff; border:2px solid var(--ink); border-radius:12px; padding:6px 10px; font-size:11px; font-weight:600; display:grid; gap:3px; box-shadow:2px 2px 0 var(--ink)}
    .map-legend i{display:inline-block; width:22px; margin-right:6px; vertical-align:middle; border-top:3px solid}
    .map-bases{position:absolute; z-index:500; left:0; right:0; bottom:10px; display:flex; gap:8px; overflow-x:auto; padding:4px 10px; scrollbar-width:none}
    .map-bases::-webkit-scrollbar{display:none}
    .map-bases button{flex:0 0 auto; background:#fff; border:2px solid var(--ink); border-radius:14px; padding:6px 12px; font-weight:700; font-size:12.5px; box-shadow:2px 2px 0 var(--ink); text-align:left}
    .map-bases button small{display:block; font-weight:600; font-size:10.5px; color:var(--ink-2)}
    .pin{display:grid; place-items:center; border:2.5px solid var(--ink); border-radius:50%; font-weight:800; color:var(--ink); box-shadow:2px 2px 0 var(--ink)}
    .pin.base{width:30px; height:30px; background:var(--pink); font-size:13px}
    .pin.spot{width:26px; height:26px; background:#fff; border-width:2px; box-shadow:none}
    .pin.spot svg{width:22px; height:22px}
    .pin.air{width:28px; height:28px; background:var(--blue-soft); font-size:14px}
    .leaflet-popup-content-wrapper{border:2px solid var(--ink); border-radius:14px; box-shadow:3px 3px 0 var(--ink)}
    .leaflet-popup-content{margin:10px 12px; font-size:13px}
    .leaflet-popup-content b{display:block; font-size:14px}
    .leaflet-popup-content button{margin-top:6px; border:2px solid var(--ink); background:var(--ink); color:#fff; border-radius:10px; padding:3px 10px; font-weight:700; font-size:12px}

    /* pratique */
    .tel{display:flex; gap:12px; align-items:center; padding:10px 12px; background:#fff; border:2px solid var(--ink); border-radius:14px; text-decoration:none}
    .tel + .tel{margin-top:8px}
    .tel b{display:block; font-size:14px}
    .tel small{display:block; font-size:11.5px; color:var(--ink-2)}
    .tel .num-big{margin-left:auto; font-size:18px; font-weight:800; background:var(--pink-soft); border:2px solid var(--ink); border-radius:12px; padding:2px 10px; white-space:nowrap}
    .info{display:grid; gap:4px}
    .info + .info{margin-top:12px}
    .info b{display:flex; gap:8px; align-items:center; font-size:14.5px}
    .info p{font-size:13px; color:var(--ink-2)}
    .src{font-size:11px; color:var(--ink-3); font-weight:600}
    .partner{font-size:10px; font-weight:700; color:#8a6a1f; background:var(--yellow-soft); border:1px dashed var(--yellow); border-radius:99px; padding:1px 7px; justify-self:start}
    .phrases{display:grid; gap:6px}
    .phrases div{display:flex; justify-content:space-between; gap:10px; background:#fff; border:1.5px solid #e4dced; border-radius:10px; padding:6px 10px; font-size:13px}
    .phrases div span:last-child{font-weight:700; text-align:right}

    /* fiche (bottom sheet) */
    .sheet-bg{position:absolute; inset:0; z-index:900; background:rgba(59,58,94,.3); opacity:0; pointer-events:none; transition:opacity .2s}
    .sheet-bg.show{opacity:1; pointer-events:auto}
    .sheet{position:absolute; z-index:901; left:0; right:0; bottom:0; max-height:88%; overflow-y:auto; background:var(--paper); border-top:var(--line); border-radius:24px 24px 0 0; box-shadow:0 -5px 0 var(--pink); padding:8px 16px calc(var(--safe-b) + 18px); transform:translateY(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1)}
    .sheet.open{transform:none}
    .grip{width:44px; height:5px; border-radius:3px; background:#c9c6da; margin:4px auto 12px}
    .sheet h2{font-size:21px}
    .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; margin:12px 0}
    .kv span{color:var(--ink-2); font-weight:600}
    .switch{position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; border:2px solid var(--ink); border-radius:16px; padding:12px 14px; background:#fff; font-weight:700; cursor:pointer}
    .switch input{position:absolute; opacity:0}
    .switch i{position:relative; width:48px; height:28px; border:2px solid var(--ink); border-radius:99px; background:#eee8f3; transition:background .15s; flex:0 0 auto}
    .switch i::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid var(--ink); transition:left .15s}
    .switch input:checked + i{background:var(--mint)}
    .switch input:checked + i::after{left:22px}
    .file{display:flex; gap:10px; align-items:center; border:2px dashed var(--ink-3); border-radius:14px; padding:10px 12px; font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer; background:#fff}
    .file input{display:none}

    .code{font-family:ui-monospace, Menlo, monospace; font-weight:800; letter-spacing:.12em; font-size:22px; background:#fff; border:2px dashed var(--ink); border-radius:14px; padding:10px 14px; text-align:center}
    input.code-in{text-transform:uppercase; letter-spacing:.12em; font-weight:700; text-align:center}

    /* étapes du projet */
    .track{display:grid; gap:0}
    .track div{display:flex; gap:10px; align-items:center; font-size:13px; font-weight:600; color:var(--ink-3); padding:5px 0}
    .track div i{flex:0 0 22px; height:22px; border-radius:50%; border:2px solid var(--ink-3); display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:800; background:#fff}
    .track .ok{color:var(--ink)} .track .ok i{background:var(--mint); border-color:var(--ink)}
    .track .now{color:var(--ink)} .track .now i{background:var(--yellow); border-color:var(--ink)}
    .caps{display:grid; gap:8px}
    .caps div{display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:13.5px; background:#fff; border:2px solid var(--ink); border-radius:12px; padding:6px 6px 6px 12px}
    .caps input{width:96px !important; flex:0 0 96px; min-height:36px !important; padding:4px 8px !important; text-align:right}

    .stars{display:flex; gap:6px; justify-content:center}
    .stars button{font-size:32px; border:0; background:none; padding:0; filter:grayscale(1); opacity:.4}
    .stars button.on{filter:none; opacity:1}

    /* vue Erika */
    .client{display:grid; gap:7px; width:100%; text-align:left}
    .client + .client{margin-top:12px}
    .client .row{justify-content:space-between}
    .client small{color:var(--ink-2); font-size:12px; font-weight:600}
    .todo-erika{display:flex; gap:10px; align-items:center; padding:10px 12px; width:100%; text-align:left; background:#fff; border:2px solid var(--ink); border-radius:14px; box-shadow:3px 3px 0 var(--sh, var(--yellow))}
    .todo-erika + .todo-erika{margin-top:10px}
    .todo-erika div{flex:1; min-width:0}
    .todo-erika small{display:block; font-size:11.5px; color:var(--ink-2)}
    .todo-erika.ok{--sh:var(--mint); opacity:.65}
    .srcs{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
    .srcs span{font-size:10.5px; font-weight:700; border:1.5px solid var(--ink-3); border-radius:99px; padding:1px 8px; background:#fff}
    .srcs span.mine{border-color:var(--mint); background:var(--mint-soft)}
    .acts{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
    .acts button{border:2px solid var(--ink); background:#fff; border-radius:10px; padding:3px 10px; font-weight:700; font-size:12px}
    .acts button.on{background:var(--mint)}
    .acts button.off{background:var(--pink-soft); text-decoration:line-through}
    .icon-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
    .icon-grid div{display:grid; justify-items:center; gap:2px; background:#fff; border:1.5px solid #e4dced; border-radius:12px; padding:6px 2px; font-size:9px; font-weight:600; color:var(--ink-2); overflow:hidden}
  </style>
</head>
<body data-no-banner>
  <div class="demo-tag">Maquette · données fictives <button type="button" id="reset">tout remettre à zéro</button></div>
  <div class="stage"><div class="phone" id="phone"></div></div>

  <script src="../assets/icons.js"></script>
  <script src="../assets/rules.js"></script>
  <script src="../assets/vendor/leaflet/leaflet.js"></script>
  <script>
  (() => {
    "use strict";
    const $phone = document.getElementById("phone");
    const icon = (n, s = 32) => (window.HodoIcons ? HodoIcons.icon(n, s) : "");
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDate = (iso, opt = { day: "numeric", month: "short" }) => iso ? new Date(iso + "T12:00").toLocaleDateString("fr-FR", opt) : "";
    const TODAY = new Date(); TODAY.setHours(12, 0, 0, 0);
    const daysUntil = (iso) => Math.round((new Date(iso + "T12:00") - TODAY) / 86400000);
    const gmaps = (name, ll) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ll ? ll.join(",") : name)}`;

    // ============ Icônes de la barre d'onglets (dessinées dans le style du lapin) ============
    const S = 'stroke="#3b3a5e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"';
    const TAB_ICONS = {
      home: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 15 16 6l10 9" fill="none" ${S}/><path d="M8.5 13.5V26h15V13.5" fill="#fde3ea" ${S}/><rect x="13.5" y="18" width="5" height="8" rx="1.2" fill="#f6a9b9" ${S}/><circle cx="23" cy="8" r="2.2" fill="#ffd98a" ${S}/></svg>`,
      book: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="6" width="18" height="21" rx="3" fill="#fff3d6" ${S}/><rect x="11.5" y="4" width="9" height="5" rx="1.5" fill="#f6a9b9" ${S}/><path d="m10.5 14 2 2 3.5-3.5M10.5 21l2 2 3.5-3.5" fill="none" ${S}/><path d="M18.5 15h3.5M18.5 22h3.5" ${S}/></svg>`,
      days: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="7" width="22" height="20" rx="3.5" fill="#fff" ${S}/><path d="M5 10.5a3.5 3.5 0 0 1 3.5-3.5h15a3.5 3.5 0 0 1 3.5 3.5V13H5z" fill="#a9cdf2" ${S}/><path d="M11 5v4M21 5v4" ${S}/><circle cx="11" cy="18" r="1.5" fill="#3b3a5e"/><circle cx="16" cy="18" r="1.5" fill="#3b3a5e"/><rect x="19" y="20" width="5" height="4.5" rx="1.2" fill="#f6a9b9" ${S}/><circle cx="11" cy="23" r="1.5" fill="#3b3a5e"/></svg>`,
      map: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="m5 9 7-3 8 3 7-3v18l-7 3-8-3-7 3z" fill="#dff5ea" ${S}/><path d="M12 6v18M20 9v18" fill="none" ${S}/><path d="M22 11c-2.2 0-3.6 1.6-3.6 3.5 0 2.6 3.6 6 3.6 6s3.6-3.4 3.6-6c0-1.9-1.4-3.5-3.6-3.5z" fill="#ec5866" ${S}/><circle cx="22" cy="14.5" r="1.2" fill="#fff"/></svg>`,
      info: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 11c0-3 3-5 7-5s7 2 7 5v13a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3z" fill="#c9b9f2" ${S}/><rect x="11.5" y="17" width="9" height="7" rx="2" fill="#efe9fc" ${S}/><path d="M13 6.5c0-2 1.3-3 3-3s3 1 3 3" fill="none" ${S}/><path d="M16 19v3M14.5 20.5h3" ${S}/></svg>`,
    };

    // ============ Données fictives ============
    const TYPES = {
      flight: { label: "Vol", icon: "ticket" }, hotel: { label: "Hébergement", icon: "house" },
      activity: { label: "Activité", icon: "star" }, transport: { label: "Transport", icon: "train" },
      food: { label: "Restaurant / café", icon: "cup" }, admin: { label: "À préparer", icon: "gem" },
    };
    const BASES = [

    function adminNew() {
      const code = "HODO-" + Math.random().toString(36).slice(2, 6).toUpperCase().replace(/[0O1IL]/g, "X");
      return `
        <div class="app-top erika-top"><button class="icon-btn" data-admin="" aria-label="Retour">←</button><div><b>Nouveau voyage</b></div></div>
        <div class="screen"><div class="stack">
          <div class="field"><label>Voyageurs</label><input placeholder="ex. Camille & Inès" /></div>
          <div class="field"><label>Destination</label><input placeholder="ex. Corée du Sud" /></div>

    // ============ Cartes (Leaflet) ============
    let maps = [];
    const TILES = "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png";
    function baseMap(el, opts = {}) {
      const m = L.map(el, { zoomControl: false, attributionControl: true, ...opts });
      L.tileLayer(TILES, { maxZoom: 18, subdomains: "abcd", attribution: "© OpenStreetMap · © CARTO" }).addTo(m);
      maps.push(m);
      return m;
    }
    const divIcon = (cls, html, size) => L.divIcon({ className: "", html: `<div class="pin ${cls}">${html}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
    function mountMaps() {
      if (!window.L) return;
      const tm = document.getElementById("tripMap");
      if (tm) {
        const m = baseMap(tm);
        const B = BASES.map((b) => b.ll);
        const line = (pts, color, dash) => L.polyline(pts, { color, weight: 4, opacity: .9, dashArray: dash }).addTo(m);
        line([B[0], B[1], B[2]], "#8fd6b1"); line([B[2], [34.6851, 135.8430], B[3]], "#8fd6b1");
        line([B[2], [35.1720, 137.0890]], "#ec5866", "8 8");
        line([[35.5494, 139.7798], [36.3, 137.6]], "#7fa9dc", "2 7"); line([[34.4320, 135.2304], [33.6, 133.6]], "#7fa9dc", "2 7");
        L.marker([35.5494, 139.7798], { icon: divIcon("air", "✈", 28) }).addTo(m).bindPopup("<b>Arrivée · Haneda</b>4 avril");
        L.marker([34.4320, 135.2304], { icon: divIcon("air", "✈", 28) }).addTo(m).bindPopup("<b>Départ · Kansai</b>16 avril");
        DAYS.forEach((d, i) => d.stops.forEach(([, name, , , ll, ic]) => {
          if (!ll) return;
          L.marker(ll, { icon: divIcon("spot", icon(ic, 22), 26) }).addTo(m).bindPopup(`<b>${esc(name)}</b>Jour ${i + 1} · ${esc(d.t)}<br><button data-day="${i}" data-tabto="days">Voir la journée</button>`);
        }));
        BASES.forEach((b, i) => L.marker(b.ll, { icon: divIcon("base", i + 1, 30), zIndexOffset: 1000 }).addTo(m).bindPopup(`<b>${esc(b.name)}</b>${b.nights}<br><button data-day="${b.day}" data-tabto="days">Voir le programme</button>`));
        m.fitBounds(L.latLngBounds([...B, [35.1720, 137.0890], [34.4320, 135.2304], [35.5494, 139.7798]]), { padding: [30, 70] });
        tm._map = m;
        setTimeout(() => { if (maps.includes(m)) m.invalidateSize(); }, 60);
      }
      const dm = document.getElementById("dayMap");
      if (dm && ui.day !== null) {
        const pts = DAYS[ui.day].stops.filter((s) => s[4]);
        const m = baseMap(dm, { dragging: !L.Browser.mobile, scrollWheelZoom: false });
        pts.forEach(([, name, , , ll, ic], k) => L.marker(ll, { icon: divIcon("spot", icon(ic, 22), 26) }).addTo(m).bindPopup(`<b>${k + 1}. ${esc(name)}</b>`));
        if (pts.length > 1) L.polyline(pts.map((p) => p[4]), { color: "#3b3a5e", weight: 2.5, dashArray: "3 6" }).addTo(m);
        if (pts.length > 1) m.fitBounds(pts.map((p) => p[4]), { padding: [26, 26], maxZoom: 15 }); else m.setView(pts[0][4], 14);
        setTimeout(() => { if (maps.includes(m)) m.invalidateSize(); }, 60);
      }
    }

    // ============ Fiches (bottom sheets) ============
    function showSheet(html) {
      const el = document.createElement("div");
      el.innerHTML = `<div class="sheet-bg" id="sbg"></div><div class="sheet" id="sheet" role="dialog"><div class="grip"></div>${html}</div>`;
      $phone.append(...el.children);
      requestAnimationFrame(() => { document.getElementById("sbg").classList.add("show"); document.getElementById("sheet").classList.add("open"); });
      document.getElementById("sbg").onclick = closeSheet;
    }
    function closeSheet() {
      const s = document.getElementById("sheet"), bg = document.getElementById("sbg");
      if (!s) return;
      s.classList.remove("open"); bg.classList.remove("show");
      setTimeout(() => { s.remove(); bg.remove(); }, 280);
    }

    function openItem(id) {
      const it = trip().items.find((i) => i.id === +id);
      if (!it) return;
      const dl = deadlineOf(it);
      showSheet(`
        <div class="row" style="gap:12px;flex-wrap:nowrap"><span style="flex:0 0 auto">${icon(TYPES[it.type].icon, 44)}</span><div><span class="small">${TYPES[it.type].label}${it.partner ? ` · <span class="partner">lien partenaire</span>` : ""}</span><h2>${esc(it.title)}</h2></div></div>
        <div class="kv">
          ${it.date ? `<span>Pour le</span><b>${fmtDate(it.date, { weekday: "long", day: "numeric", month: "long" })}</b>` : ""}
          ${dl ? `<span>${dl.rule ? "Ouverture" : "Avant le"}</span><b>${dl.rule ? esc(HodoRules.describe(dl.opens).local) : fmtDate(dl.iso, { day: "numeric", month: "long", year: "numeric" })}</b>` : ""}
          <span>Où</span><b>${esc(it.where)}</b>
          ${it.price ? `<span>Prix indicatif</span><b>${esc(it.price)}</b>` : ""}
        </div>
        ${dl && dl.rule ? `<div class="note" style="margin-bottom:12px"><span class="ico">🔔</span><span>${esc(dl.rule.how)} Je t’envoie un rappel la veille. <button class="linklike" data-action="ics" data-id="${it.id}">Ajouter à mon agenda</button></span></div>` : ""}
        ${it.note ? `<div class="note tip" style="margin-bottom:12px"><span class="ico">✳</span><span><b>Le conseil d’Erika :</b> ${esc(it.note)}</span></div>` : ""}
        ${it.partner ? `<p class="small" style="margin-bottom:10px">Lien partenaire : si tu réserves par ce lien, Erika touche une petite commission, sans surcoût pour toi.</p>` : ""}
        ${it.link ? `<a class="btn block" href="${esc(it.link)}" target="_blank" rel="noopener" style="margin-bottom:14px">Réserver sur ${esc(it.where)} ↗</a>` : ""}
        <form id="itemForm" data-id="${it.id}">
          <label class="switch">C’est réservé !<input type="checkbox" name="done" ${it.status === "done" ? "checked" : ""} /><i></i></label>
          <div class="field"><label>N° de réservation <span class="small">(facultatif)</span></label><input name="ref" value="${esc(it.ref)}" placeholder="ex. 4821 339 610" /></div>
          <div class="field"><label>Prix payé <span class="small">(facultatif)</span></label><input name="paid" value="${esc(it.paid)}" placeholder="ex. 372 €" /></div>
          <label class="file"><input type="file" name="file" accept="application/pdf,image/*" /><span>📎</span><span id="fname">${it.file ? esc(it.file) : "Joindre la confirmation (PDF ou capture) · facultatif"}</span></label>
          <div class="field"><label>Note pour moi</label><textarea name="mynote" style="min-height:70px" placeholder="ex. chambre 2 lits, check-in 15:00">${esc(it.mynote || "")}</textarea></div>
          <button class="btn dark block" type="submit">Enregistrer</button>
        </form>`);
      const form = document.getElementById("itemForm");
      form.file.onchange = () => { if (form.file.files[0]) document.getElementById("fname").textContent = form.file.files[0].name; };
    }

    function openPay() {
      showSheet(`
        <h2>Paiement</h2><p class="small" style="margin:4px 0 12px">Planification du voyage · Japon · <b>185 €</b> <span class="pill dark">0 € pendant le lancement</span></p>
        <div class="stack">
          <div class="filters"><button class="on">💳 Carte</button><button>Bancontact</button><button>Virement</button></div>
          <div class="field"><label>Numéro de carte</label><input value="4242 4242 4242 4242" disabled /></div>
          <div class="two"><div class="field"><label>Expiration</label><input value="12 / 29" disabled /></div><div class="field"><label>CVC</label><input value="123" disabled /></div></div>
          <button class="btn dark block" data-action="pay">Payer (démo)</button>
          <p class="small" style="text-align:center">Dans la vraie app : paiement sécurisé (Stripe ou Mollie), facture envoyée par mail.</p>
        </div>`);
    }

    function toast(msg) {
      let el = document.querySelector(".toast");
      if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
      el.textContent = msg; el.classList.add("show");
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2300);
    }

    function render(keepScroll) {
      const top = document.getElementById("scr")?.scrollTop || 0;
      maps.forEach((m) => { m.stop(); m.remove(); }); maps = [];
      $phone.innerHTML = SCREENS[ui.screen]();
      const scr = document.getElementById("scr") || $phone.querySelector(".screen");
      if (scr) scr.scrollTop = keepScroll ? top : 0;
      mountMaps();
    }

    // ============ Interactions ============
    $phone.addEventListener("click", (e) => {
      const t = e.target.closest("[data-go],[data-tab],[data-filter],[data-open],[data-action],[data-admin],[data-fill],[data-day],[data-base],[data-q],[data-lib],[data-star],[data-keep],[data-drop]");
      if (!t) return;
      const d = t.dataset;
      if (d.go) { ui = { ...freshUi(), screen: d.go }; render(); }
      else if (d.tab) { ui.tab = d.tab; ui.me = false; ui.day = null; render(); }
      else if (d.day !== undefined) { if (d.tabto) ui.tab = d.tabto; ui.day = d.day === "back" ? null : +d.day; ui.me = false; render(); }
      else if (d.filter) { ui.filter = d.filter; render(true); }
      else if (d.open) openItem(d.open);
      else if (d.fill) document.getElementById("c").value = d.fill;
      else if (d.base !== undefined) { const m = document.getElementById("tripMap")?._map; if (m) m.flyTo(BASES[+d.base].ll, 11, { duration: .8 }); }
      else if (d.admin !== undefined) { ui.screen = "admin"; ui.admin = d.admin || null; render(); }
      else if (d.lib) { ui.lib = d.lib; render(); }
      else if (d.q) {
        const q = db.queue.find((x) => x.id === d.q);
        if (q.kind === "day" && !q.ok) { ui.admin = "draft"; render(); return; }
        q.ok = !q.ok; save(); render(true); toast(q.ok ? "Validé : visible par les voyageurs" : "Remis en attente");
      }
      else if (d.keep !== undefined || d.drop !== undefined) {
        t.parentElement.querySelectorAll("button").forEach((b) => b.classList.remove("on", "off"));
        t.classList.add(d.keep !== undefined ? "on" : "off");
      }
      else if (d.star) { ui.stars = +d.star; document.querySelectorAll("#stars button").forEach((b) => b.classList.toggle("on", +b.dataset.star <= ui.stars)); }
      else if (d.action) action(d.action, t);
    });

    function action(a, t) {
      if (a === "code") {
        const c = document.getElementById("c").value.trim().toUpperCase(), m = document.getElementById("m").value.trim();
        const err = (msg) => { document.getElementById("errTx").textContent = msg; document.getElementById("err").classList.remove("hidden"); };
        if (c !== trip().code) return err("Ce code ne correspond à aucun voyage. Vérifie le message d’Erika.");
        if (!/^\S+@\S+\.\S+$/.test(m)) return err("Indique ton email pour recevoir le lien de connexion.");
        ui.screen = "sent"; render();
      }
      else if (a === "me") { ui.me = !ui.me; render(); }
      else if (a === "install" && installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); }
      else if (a === "share") toast("Code copié : " + trip().code);
      else if (a === "pdf") toast("Demande de PDF envoyée à Erika (démo)");
      else if (a === "paper") toast("Demande de carnet papier envoyée à Erika (démo)");
      else if (a === "wa") toast("Ouvre WhatsApp avec Erika (démo)");
      else if (a === "add") document.getElementById("addForm").classList.toggle("hidden");
      else if (a === "other") toast("L’IA cherche une autre idée… (démo)");
      else if (a === "newIcon") toast("Icône proposée : elle attend ta validation (démo)");
      else if (a === "ics") { const it = trip().items.find((i) => i.id === +t.dataset.id); HodoRules.downloadIcs(HodoRules.compute(it.rule, it.date), it.date); }
      else if (a === "pay") { closeSheet(); setTimeout(() => { ui.screen = "paid"; render(); }, 300); }
      else if (a === "validateDay") { db.queue.find((x) => x.id === "q1").ok = true; save(); ui.admin = null; render(); toast("Journée validée : Léa & Tom la voient maintenant"); }
      else if (a === "review") {
        if (!ui.stars) { toast("Choisis d’abord une note"); return; }
        db.review = { stars: ui.stars, text: document.getElementById("revTx").value.trim(), publish: document.getElementById("revOk").checked };
        save(); render(true); toast("Merci pour ton avis !");
      }
    }

    $phone.addEventListener("submit", (e) => {
      e.preventDefault();
      const f = e.target;
      if (f.id === "briefForm") {
        if (!f.c1.checked || !f.c2.checked) { document.getElementById("briefErr").classList.remove("hidden"); return; }
        openPay();
      } else if (f.id === "itemForm") {
        const it = trip().items.find((i) => i.id === +f.dataset.id);
        it.status = f.done.checked ? "done" : "todo";
        it.ref = f.ref.value.trim(); it.paid = f.paid.value.trim(); it.mynote = f.mynote.value.trim();
        if (f.file.files[0]) it.file = f.file.files[0].name; // la maquette ne garde que le nom du fichier
        save(); closeSheet(); render(true);
        toast(it.status === "done" ? "Bien joué, c’est coché ✓" : "Enregistré");
      } else if (f.id === "addForm") {
        const rule = HodoRules.RULES.find((r) => r.id === f.rule.value);
        if (!f.title.value.trim() && !rule) { f.title.classList.add("invalid"); return; }
        const t = trip();
        t.items.push({ id: Math.max(...t.items.map((i) => i.id)) + 1, type: rule ? "activity" : f.type.value, title: f.title.value.trim() || rule.name,
          where: f.where.value.trim() || (rule ? rule.name : "—"), link: f.link.value.trim() || (rule ? rule.link : ""),
          rule: rule ? rule.id : undefined, date: f.date.value, deadline: f.deadline.value, price: f.price.value.trim(), note: f.note.value.trim(),
          partner: f.partner.checked, urgent: f.urgent.checked, status: "todo", ref: "", paid: "", file: "" });
        save(); render();
        toast(rule && !f.date.value ? "Ajouté : indique la date de visite pour calculer l’ouverture" : "Ajouté : les voyageurs le voient tout de suite");
      }
    });

    document.getElementById("reset").onclick = () => { db = SEED(); save(); ui = freshUi(); render(); toast("Maquette remise à zéro"); };

    render();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  })();
  </script>
</body>
</html>
