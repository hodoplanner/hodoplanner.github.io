<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HodoPlanner</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://hodoplanner.com/app/" />
  <meta http-equiv="refresh" content="0; url=../app/" />
  <script>
    // l'ancienne démo n'existe plus : on retire son installation et on ouvre la vraie app
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.endsWith("/maquette/")) r.unregister(); }));
    if (window.caches) caches.keys().then((ks) => ks.filter((k) => k.startsWith("hodo-maquette-")).forEach((k) => caches.delete(k)));
    location.replace("../app/");
  </script>
</head>
<body><p><a href="../app/">Ouvrir HodoPlanner</a></p></body>
</html>
